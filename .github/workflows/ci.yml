name: CI

# Un solo runner Linux, sin matriz de compilacion: el addon es GDScript puro y no hay
# codigo nativo que compilar por plataforma. El juego de ejemplo, Nidada, si compila
# Rust, pero solo para Linux y solo para probarlo (trabajos nidada-*).
#
# Los tests que tocan devnet NO entran aqui: dependen de una red externa y de un
# faucet con limite. Van en `npm run test:devnet`, ejecutado a mano, y su resultado
# se documenta en la memoria.

on:
  push:
    # nidada-j5 es la rama por defecto en GitHub y la linea de trabajo del PFM.
    branches: [main, nidada-j5]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vocab-guard:
    name: Guardia de vocabulario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Invariante de diseno convertido en test automatico: ningun concepto de cadena
      # cruza al addon ni a la demo del hito, que es un juego que lo usa (propuesta, 9).
      # Si esto falla, la costura entre el juego y la infraestructura esta rota, y es un
      # fallo de diseno, no de estilo.
      - name: Ningun concepto de cadena en addon/ ni en examples/chain-demo/
        run: |
          if grep -rniE '(solana|pubkey|lamport|blockhash|base58|spl|mint)' addon/ examples/chain-demo/; then
            echo "::error::Vocabulario de cadena filtrado en addon/ o en examples/chain-demo/. Ver CLAUDE.md, invariante 3."
            exit 1
          fi
          echo "addon/ y examples/chain-demo/ limpios."

      # La demo lleva una copia del addon, como la llevaria cualquier juego. Tiene que ser
      # identica a la de addon/: si no, la demo prueba otra cosa.
      - name: La copia del addon en la demo es identica
        run: diff -r addon/addons/godot_chain examples/chain-demo/addons/godot_chain

      # El addon es GDScript puro (invariante 4). Un manifiesto de dependencias o un
      # binario ahi significa que alguien ha metido algo que no deberia. Los binarios se
      # buscan por contenido, no por extension: grep -I los trata como sin coincidencias.
      - name: Ninguna dependencia ni binario en addon/
        run: |
          if find addon/ -type f \( -name 'package.json' -o -name 'Cargo.toml' -o -name '*.gdextension' \) | grep .; then
            echo "::error::addon/ debe ser GDScript puro y sin dependencias."
            exit 1
          fi
          binaries=$(find addon/ -type f -size +0c -exec grep -IL '' {} +)
          if [ -n "$binaries" ]; then
            echo "$binaries"
            echo "::error::addon/ no puede llevar binarios."
            exit 1
          fi
          echo "addon/ sin dependencias ni binarios."

      # Invariante 4: el HTTP pasa por HTTPRequest y todo ocurre en el hilo principal
      # (propuesta, 6, punto 3). Ni hilos ni otra via de red.
      - name: Sin hilos ni red propia en addon/
        run: |
          if grep -rnwE 'Thread|Mutex|Semaphore|WorkerThreadPool|StreamPeerTCP|StreamPeerTLS|PacketPeerUDP|WebSocketPeer' addon/ \
             || grep -rnE 'HTTPClient\.new' addon/; then
            echo "::error::addon/ usa hilos o una via de red que no es HTTPRequest. Ver CLAUDE.md, invariante 4."
            exit 1
          fi
          echo "addon/ sin hilos y con HTTPRequest como unica via de red."

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Estilo
        run: npm run lint

      # Incluye, a partir del bloque 2, los vectores fijos de derivacion de claves y
      # el test del invariante de firmante unico.
      - name: Tests
        run: npm test

      # Bloquea solo lo que se ejecuta en produccion. Las herramientas de desarrollo (vitest,
      # eslint) se auditan aparte sin bloquear: un aviso sin correccion en ellas no debe parar la
      # CI (17-nov-2026: GHSA-fc5q-39xc-vjpf en picomatch, que solo llega por vitest).
      - name: Vulnerabilidades (produccion)
        run: npm audit --omit=dev --audit-level=high

      - name: Vulnerabilidades (desarrollo, informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Licencias
        run: npm run licenses

  # Servidor de juego de ejemplo del hito (A3): autoriza, registra antes de llamar y
  # reenvia. Sus tests usan un backend falso, sin red externa.
  game-server:
    name: Servidor de juego (ejemplo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/game-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/game-server/package-lock.json

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Bloquea solo lo que se ejecuta en produccion. Las herramientas de desarrollo (vitest,
      # eslint) se auditan aparte sin bloquear: un aviso sin correccion en ellas no debe parar la
      # CI (17-nov-2026: GHSA-fc5q-39xc-vjpf en picomatch, que solo llega por vitest).
      - name: Vulnerabilidades (produccion)
        run: npm audit --omit=dev --audit-level=high

      - name: Vulnerabilidades (desarrollo, informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Programa on-chain chain-assets (propuesta, 4.7): anchor build y los tests con LiteSVM,
  # sin red. El despliegue en devnet es manual y no entra aqui.
  program:
    name: Programa (Anchor)
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: 4.1.2
      ANCHOR_VERSION: 1.2.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/registry
            target
          key: program-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: program-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}-

      # Las crates de agave que arrastra litesvm piden rustc >= 1.98.1 (verificaciones, V5).
      - name: Instalar Solana y Anchor
        run: |
          rustup update stable --no-self-update
          rustc --version
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          if ! command -v avm >/dev/null; then
            cargo install --git https://github.com/otter-sec/anchor --tag "v${ANCHOR_VERSION}" avm --locked
          fi
          avm install "${ANCHOR_VERSION}" || true
          avm use "${ANCHOR_VERSION}"

      # La clave del programa no esta en el repositorio: anchor build genera una efimera y
      # --ignore-keys evita que la compare con declare_id!, que es el id real de devnet.
      - name: Compilar
        run: |
          anchor --version
          anchor build --ignore-keys

      - name: Tests (LiteSVM, sin red)
        run: cargo test -p chain-assets --locked

  # Suite del addon en modo mock, sin red (fase A2). addon/ es a la vez el addon y un
  # proyecto Godot minimo que registra el autoload, para poder ejecutarla.
  godot-headless:
    name: Addon (Godot headless)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot

      # La importacion registra las clases con nombre (ChainConfig, ChainHandle,
      # ChainError). Puede terminar con error sin pantalla, como en nidada-godot: no se
      # detiene aqui, porque si las clases no quedan registradas la suite no compila.
      - name: Importar el proyecto
        run: ./godot --headless --path addon --import || echo "::warning::godot --import termino con codigo $?"

      # Con tiempo maximo: tras un error de GDScript, Godot headless puede no salir.
      - name: Suite del addon
        run: timeout 120 ./godot --headless --path addon --script res://tests/run.gd

  # Nidada: el juego que sirve de banco de pruebas (docs/juego/plan.md). Su Rust vive
  # en rust/ y su GDExtension en examples/godot-demo, nunca en addon/: las guardias de
  # arriba siguen valiendo tal cual para la libreria.
  nidada-rust:
    name: Nidada (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml fija la version; rustup la instala al primer comando.
      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Incluye las tablas del diseno como vectores fijos.
      - name: Tests
        run: cargo test --locked

      # Invariantes 2-4 de docs/juego/arquitectura-cliente-rust.md, convertidos en test.
      - name: Reglas sin dependencias
        run: |
          deps=$(cargo tree -p nidada-rules -e normal --prefix none --depth 1 | tail -n +2)
          if [ -n "$deps" ]; then
            echo "::error::nidada-rules tiene que ser puro y no tener dependencias: $deps"
            exit 1
          fi

      - name: Sin red, hilos ni cadena en el dispositivo
        run: |
          if cargo tree -p nidada-ext -e normal --prefix none | grep -iE '^(tokio|reqwest|solana|spl-)'; then
            echo "::error::nidada-ext corre en el dispositivo: ni red propia, ni runtime async, ni crates de cadena."
            exit 1
          fi

      # cargo tree no ve los hilos de la biblioteca estandar: se buscan en el codigo.
      - name: Sin hilos propios en el dispositivo
        working-directory: .
        run: |
          if grep -rnE 'std::thread|thread::spawn|tokio::' rust/nidada-ext/src rust/nidada-rules/src; then
            echo "::error::Hilos o runtime async en el dispositivo: el HTTP pasa por HTTPRequest de Godot."
            exit 1
          fi

      # Limites de palabra: 'SplitMix64' o 'display' no son vocabulario de cadena.
      - name: Ningun concepto de cadena en el cliente del juego
        working-directory: .
        run: |
          if grep -rniE '(solana|pubkey|lamport|blockhash|base58|\bspl([-_]|\b)|\bmint)' \
               rust/nidada-rules rust/nidada-ext examples/godot-demo \
               --include='*.rs' --include='*.gd' --include='*.toml' --include='*.gdextension' --include='*.godot'; then
            echo "::error::Vocabulario de cadena en el cliente de Nidada."
            exit 1
          fi

  nidada-godot:
    name: Nidada (Godot headless)
    runs-on: ubuntu-latest
    needs: nidada-rust
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Compilar nidada-ext para Linux
        run: rust/build-ext.sh

      - name: Descargar Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot

      # La importacion registra la GDExtension; sin ella el primer arranque no la carga.
      # Godot termina con error en --import sin pantalla (134 en Linux, 139 en Windows,
      # con o sin extension). No se detiene aqui: lo decide el test siguiente, que falla
      # si la extension no ha quedado cargada.
      - name: Importar el proyecto
        run: ./godot --headless --path examples/godot-demo --import || echo "::warning::godot --import termino con codigo $?"

      - name: Test de la GDExtension
        run: ./godot --headless --path examples/godot-demo --script res://tests/test_ext.gd
