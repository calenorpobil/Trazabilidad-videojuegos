name: CI

# Un solo runner Linux, sin matriz de compilacion: al no haber GDExtension en la
# libreria no hay codigo nativo que compilar por plataforma. Ese es precisamente el
# beneficio de haber descartado Rust en el cliente. El juego de ejemplo, Nidada, si
# compila Rust, pero solo para Linux y solo para probarlo (trabajos nidada-*).
#
# Los tests que tocan devnet NO entran aqui: dependen de una red externa y de un
# faucet con limite. Van en `npm run test:devnet`, ejecutado a mano, y su resultado
# se documenta en la memoria.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guardia de vocabulario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Invariante de diseno convertido en test automatico: ningun concepto de cadena
      # cruza al addon. Si esto falla, la costura entre el juego y la infraestructura
      # esta rota, y es un fallo de diseno, no de estilo.
      - name: Ningun concepto de cadena en addon/
        run: |
          if grep -rniE '(solana|pubkey|lamport|blockhash|base58|spl|mint)' addon/; then
            echo "::error::Vocabulario de cadena filtrado en addon/. Ver CLAUDE.md, invariante 3."
            exit 1
          fi
          echo "addon/ limpio."

      # El addon es GDScript puro. Un manifiesto de dependencias o un binario ahi
      # significa que alguien ha metido algo que no deberia.
      - name: Ninguna dependencia ni binario en addon/
        run: |
          if find addon/ -type f \( -name 'package.json' -o -name '*.dll' -o -name '*.so' -o -name '*.dylib' -o -name '*.gdextension' \) | grep .; then
            echo "::error::addon/ debe ser GDScript puro y sin dependencias."
            exit 1
          fi
          echo "addon/ sin dependencias ni binarios."

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Estilo
        run: npm run lint

      # Incluye, a partir del bloque 2, los vectores fijos de derivacion de claves y
      # el test del invariante de firmante unico.
      - name: Tests
        run: npm test

      - name: Vulnerabilidades
        run: npm audit --audit-level=high

      - name: Licencias
        run: npm run licenses

  # Pendiente: Godot en modo headless ejecutando la suite del addon en modo mock, sin
  # red. Entra en el bloque 7, que es cuando existe esa suite. Anadir aqui un trabajo
  # que no ejecuta nada solo sirve para tener una casilla verde que no comprueba nada.

  # Nidada: el juego que sirve de banco de pruebas (docs/plan-juego.md). Su Rust vive
  # en rust/ y su GDExtension en examples/godot-demo, nunca en addon/: las guardias de
  # arriba siguen valiendo tal cual para la libreria.
  nidada-rust:
    name: Nidada (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml fija la version; rustup la instala al primer comando.
      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Incluye las tablas del diseno como vectores fijos.
      - name: Tests
        run: cargo test --locked

      # Invariantes 2-4 de docs/implementacion-android.md, convertidos en test.
      - name: Reglas sin dependencias
        run: |
          deps=$(cargo tree -p nidada-rules -e normal --prefix none --depth 1 | tail -n +2)
          if [ -n "$deps" ]; then
            echo "::error::nidada-rules tiene que ser puro y no tener dependencias: $deps"
            exit 1
          fi

      - name: Sin red, hilos ni cadena en el dispositivo
        run: |
          if cargo tree -p nidada-ext -e normal --prefix none | grep -iE '^(tokio|reqwest|solana|spl-)'; then
            echo "::error::nidada-ext corre en el dispositivo: ni red propia, ni runtime async, ni crates de cadena."
            exit 1
          fi

      # cargo tree no ve los hilos de la biblioteca estandar: se buscan en el codigo.
      # Cuando exista rust/godot-chain, anadirlo a esta lista y al cargo tree de arriba.
      - name: Sin hilos propios en el dispositivo
        working-directory: .
        run: |
          if grep -rnE 'std::thread|thread::spawn|tokio::' rust/nidada-ext/src rust/nidada-rules/src; then
            echo "::error::Hilos o runtime async en el dispositivo: el HTTP pasa por HTTPRequest de Godot."
            exit 1
          fi

      # Limites de palabra: 'SplitMix64' o 'display' no son vocabulario de cadena.
      - name: Ningun concepto de cadena en el cliente del juego
        working-directory: .
        run: |
          if grep -rniE '(solana|pubkey|lamport|blockhash|base58|\bspl([-_]|\b)|\bmint)' \
               rust/nidada-rules rust/nidada-ext examples/godot-demo \
               --include='*.rs' --include='*.gd' --include='*.toml' --include='*.gdextension' --include='*.godot'; then
            echo "::error::Vocabulario de cadena en el cliente de Nidada."
            exit 1
          fi

  nidada-godot:
    name: Nidada (Godot headless)
    runs-on: ubuntu-latest
    needs: nidada-rust
    env:
      GODOT_VERSION: 4.7.1
    steps:
      - uses: actions/checkout@v4

      - name: Compilar nidada-ext para Linux
        run: rust/build-ext.sh

      - name: Descargar Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot

      # La importacion registra la GDExtension; sin ella el primer arranque no la carga.
      - name: Importar el proyecto
        run: ./godot --headless --path examples/godot-demo --import

      - name: Test de la GDExtension
        run: ./godot --headless --path examples/godot-demo --script res://tests/test_ext.gd
